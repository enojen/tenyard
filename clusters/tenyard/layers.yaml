# The cluster in four layers, each one after the one before (dependsOn), all from main of this
# repo. Every object in git belongs to one layer; Flux deletes one that leaves git (prune) and
# puts back a field changed by hand at the next run (interval).
#   cluster         the namespaces and the LimitRange (install/cluster)
#   secrets         secrets/, decrypted with the age key in the Secret flux-system/sops-age
#   infrastructure  the CCM, the CSI driver and the autoscaler; ready before the apps
#   apps            monitoring, the tenbox server and the backups
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: cluster, namespace: flux-system }
spec:
  interval: 10m
  path: ./install/cluster
  prune: true
  sourceRef: { kind: GitRepository, name: tenyard }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: secrets, namespace: flux-system }
spec:
  dependsOn: [{ name: cluster }]
  interval: 10m
  path: ./secrets
  prune: true
  sourceRef: { kind: GitRepository, name: tenyard }
  decryption:
    provider: sops
    secretRef: { name: sops-age }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: infrastructure, namespace: flux-system }
spec:
  dependsOn: [{ name: secrets }]
  interval: 10m
  path: ./clusters/tenyard/infrastructure
  prune: true
  wait: true
  timeout: 5m
  sourceRef: { kind: GitRepository, name: tenyard }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: apps, namespace: flux-system }
spec:
  dependsOn: [{ name: infrastructure }]
  interval: 10m
  path: ./clusters/tenyard/apps
  prune: true
  sourceRef: { kind: GitRepository, name: tenyard }
