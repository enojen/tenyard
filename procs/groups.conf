# The process groups of a box (procs/src/groups.rs): <group> <sticky|open> <regex over the
# command line>. The first matching rule wins; below a sticky group every descendant stays in it.
# A process that matches nothing takes its parent's group, or other.

# What boot.sh starts around the tenbox command; their command lines can hold any text of the
# command (a `decide --json` answer), so they come first.
other   open    ^(\S*/)?bash \S*/tenbox-boot( |$)
other   open    ^(\S*/)?(sudo|tee)( |$)
other   open    ^(\S*/)?bash -c cd '[^']*' &&
other   open    ^(\S*/)?claude agents\b

# This collector, in its own sidecar: its CPU is pod CPU, but not the box's.
procs   open    ^/procs( |$)

# The sidecars of task/services/.
service sticky  ^(\S*/)?(postgres|redis-server|mysqld)\b

claude  open    ^(\S*/)?claude( |$)
claude  open    /claude/versions/
tenbox  open    ^(\S*/)?bun \S*tenbox\S*( |$)
tenbox  open    ^(\S*/)?tenbox( |$)

test    sticky  \b(bun test|vitest|jest|mocha|playwright test|(npm|pnpm|yarn|bun) (run )?test)\b
tsc     sticky  \b(tsc|tsgo|vue-tsc)\b
lint    sticky  \b(biome|eslint|oxlint|prettier|knip)\b
install sticky  \b(bun|npm|pnpm|yarn) (install|ci|i|add)\b
git     sticky  ^(\S*/)?git(-[a-z-]+)?( |$)
