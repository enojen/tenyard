[package]
name = "procs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Per-group CPU and memory of the processes in one box pod, as Prometheus metrics"
license = "Apache-2.0"

[dependencies]
regex = "1.13.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
