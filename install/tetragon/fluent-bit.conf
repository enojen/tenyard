[SERVICE]
    flush         1
    log_level     warn
    parsers_file  /config/parsers.conf

[INPUT]
    name              tail
    path              /var/log/tetragon/tetragon.log
    db                /var/log/tetragon/fluent-bit.db
    read_from_head    true
    parser            tetragon
    buffer_max_size   4M
    tag               tetragon

[OUTPUT]
    name         http
    match        tetragon
    host         victoria-logs.monitoring.svc.cluster.local
    port         9428
    uri          /insert/jsonline?_stream_fields=stream&_time_field=time&extra_fields=stream=tetragon
    format       json_lines
    json_date_key false
    retry_limit  false
