# The daily copy off the host: backup.sh at 03:30 UTC, after the CronJob backup of the server
# has written its copy at 03:00. It runs on the control-plane server, as the k3s datastore is
# there, and in namespace tenbox-server, as the volume of the server's database is there. It
# reads the database of k3s with SQLite's online backup, which needs write access to its
# directory for the lock. The server's volume is read only in the container alone: the server
# mounts it read-write already, and ext4 refuses a second, read-only mount of it. The bucket
# keys are the Secret backup-bucket (secrets/); the notice on a failure goes to the URL of the
# Secret ntfy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-backup
  namespace: tenbox-server
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "reads the k3s datastore, which only root may read"
    ignore-check.kube-linter.io/no-read-only-root-fs: "installs sqlite, age and curl with apk at start"
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "the ttl removes a finished Job; the history limits never keep one longer"
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
          tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
          containers:
            - name: backup
              image: alpine:3.22@sha256:bfe7ceb9f09ec0566c48fb93356e45a47a00be5a1dd14fa5b909e7709c66b034
              command: [sh, /script/backup.sh]
              env:
                - { name: ENDPOINT, value: hel1.your-objectstorage.com }
                - { name: REGION, value: hel1 }
                - { name: BUCKET, value: tenyard-backups }
                # The age key of Tenyard, as in .sops.yaml.
                - { name: AGE_RECIPIENT, value: age1y5ghz0eu2vuxxwe9njucus27sh9u8sv4ujvn6u8rxxtaecc8avwsllhe5y }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: script, mountPath: /script, readOnly: true }
                - { name: k3s-db, mountPath: /k3s/db }
                - { name: k3s-token, mountPath: /k3s/token, readOnly: true }
                - { name: server, mountPath: /server, readOnly: true }
                - { name: bucket, mountPath: /bucket, readOnly: true }
                - { name: ntfy, mountPath: /ntfy, readOnly: true }
          volumes:
            - { name: script, configMap: { name: backup-script } }
            - { name: k3s-db, hostPath: { path: /var/lib/rancher/k3s/server/db, type: Directory } }
            - { name: k3s-token, hostPath: { path: /var/lib/rancher/k3s/server/token, type: File } }
            - { name: server, persistentVolumeClaim: { claimName: tenbox-server } }
            - { name: bucket, secret: { secretName: backup-bucket } }
            - { name: ntfy, secret: { secretName: ntfy } }
