# Tenport on the user's tailnet: one Tailscale node `tenport` that serves
# https://tenport.<tailnet>.ts.net to the Tenport Service, with a Tailscale certificate, the same
# way as Grafana (install/monitoring/tailnet.yaml). No public port: only the devices of the
# tailnet reach it. Its state lives in Secret `tailscale-tenport`; the one-time auth key comes
# from Secret `tailscale-auth` in namespace tenport, made by hand (install/README.md, "Tenport").
apiVersion: v1
kind: ServiceAccount
metadata: { name: tailscale-tenport, namespace: tenport }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: tailscale-tenport, namespace: tenport }
rules:
  # Its own state only. `create` cannot be limited to one name, so the Secret exists up front.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tailscale-tenport]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: tailscale-tenport, namespace: tenport }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: tailscale-tenport }
subjects: [{ kind: ServiceAccount, name: tailscale-tenport, namespace: tenport }]
---
apiVersion: v1
kind: Secret
metadata: { name: tailscale-tenport, namespace: tenport }
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata: { name: tailscale-tenport, namespace: tenport }
data:
  # ${TS_CERT_DOMAIN} is filled by the image with the node's MagicDNS name.
  serve.json: |
    {
      "TCP": { "443": { "HTTPS": true } },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": { "/": { "Proxy": "http://tenport.tenport.svc:8080" } }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-tenport
  namespace: tenport
  annotations:
    ignore-check.kube-linter.io/env-var-secret: "TS_KUBE_SECRET names the Secret that keeps the node key; it holds no secret"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tailscale-tenport } }
  template:
    metadata: { labels: { app: tailscale-tenport } }
    spec:
      serviceAccountName: tailscale-tenport
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true }
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.104.2
          env:
            - { name: TS_USERSPACE, value: "true" }
            - { name: TS_HOSTNAME, value: tenport }
            - { name: TS_KUBE_SECRET, value: tailscale-tenport }
            - { name: TS_SERVE_CONFIG, value: /config/serve.json }
            - { name: TS_EXTRA_ARGS, value: --advertise-tags=tag:k8s }
            # Read only at the first login; the node key then lives in the state Secret.
            - name: TS_AUTHKEY
              valueFrom: { secretKeyRef: { name: tailscale-auth, key: TS_AUTHKEY, optional: true } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: tailscale-tenport } }
        - { name: tmp, emptyDir: {} }
