# Tenport, the backend that takes over from the tenbox server (enojen/tenport, docs/capabilities.md
# section 9), in its own namespace, on the server next to the control plane. Its SQLite file sits
# on a Hetzner volume. The Service is reachable inside the cluster only; people reach Tenport over
# the tailnet (tailnet.yaml). Its account may start, read and delete the Jobs of namespace tenbox,
# from the Job template of task/. The first admin: install/README.md, "Tenport".
apiVersion: v1
kind: ServiceAccount
metadata: { name: tenport, namespace: tenport }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: tenport-runs, namespace: tenbox }
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: tenport-runs, namespace: tenbox }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenport-runs }
subjects: [{ kind: ServiceAccount, name: tenport, namespace: tenport }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tenport, namespace: tenport }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hcloud-volumes
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenport
  namespace: tenport
  annotations:
    ignore-check.kube-linter.io/env-var-secret: "each *_FILE env is the path of a mounted Secret file, not the secret"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tenport } }
  template:
    metadata: { labels: { app: tenport } }
    spec:
      serviceAccountName: tenport
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      securityContext: { runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true, fsGroup: 65534 }
      containers:
        - name: tenport
          image: ghcr.io/enojen/tenport-server:a7660d3eadc543328c78d696d4fc7c8866091985@sha256:a324c10c860e71ffeeeee1848d242e089261f3d515d3b2cdfc00fa20dbd14ca6
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: TENPORT_DATABASE, value: /data/tenport.db }
            - { name: SQLITE_TMPDIR, value: /tmp }
            - { name: TENPORT_TASK_ARCHIVE_BUCKET, value: "https://hel1.your-objectstorage.com/tenbox-enojen" }
            - { name: TENPORT_TASK_ARCHIVE_BUCKET_REGION, value: hel1 }
            - { name: TENPORT_TASK_ARCHIVE_BUCKET_KEY_FILE, value: /task-archive-bucket/access_key }
            - { name: TENPORT_TASK_ARCHIVE_BUCKET_SECRET_FILE, value: /task-archive-bucket/secret_key }
            - { name: TENPORT_RUN_CREDENTIAL_KEY_FILE, value: /run-credentials/key }
            - { name: TENPORT_INJECTOR_TOKEN_FILE, value: /run-credentials/injector-token }
            - { name: TENPORT_GITHUB_APP_ID, value: "5669876" }
            - { name: TENPORT_GITHUB_APP_KEY_FILE, value: /github-app/key.pem }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: http } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: run-template, mountPath: /etc/tenport/run-template, readOnly: true }
            - { name: run-services, mountPath: /etc/tenport/run-services, readOnly: true }
            - { name: task-archive-bucket, mountPath: /task-archive-bucket, readOnly: true }
            - { name: run-credentials, mountPath: /run-credentials, readOnly: true }
            - { name: github-app, mountPath: /github-app, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: tenport } }
        - { name: tmp, emptyDir: {} }
        - { name: run-template, configMap: { name: run-template } }
        - { name: run-services, configMap: { name: run-services } }
        - { name: task-archive-bucket, secret: { secretName: task-archive-bucket, defaultMode: 0440 } }
        - { name: run-credentials, secret: { secretName: run-credentials, defaultMode: 0440 } }
        - { name: github-app, secret: { secretName: github-app, defaultMode: 0440 } }
---
apiVersion: v1
kind: Service
metadata: { name: tenport, namespace: tenport }
spec:
  selector: { app: tenport }
  ports: [{ port: 8080, targetPort: http, name: http }]
