# cluster-autoscaler v1.36.1 with the Hetzner provider, on the control plane. Three pools in
# hel1, where the task volumes live, each from 0, tried in the order of the priority expander:
# cx43 (cheapest, often sold out), then cpx32, then cpx42. A pool Hetzner cannot place is backed
# off and the next one is tried. All nodes together stay within 32 cores, the shared core limit
# of the project. A worker goes when it was unneeded for 50 minutes, near the end of its billed hour. RBAC follows the upstream chart
# of 1.36.1 without the rules of other providers. autoscaler.sh writes the Secret
# `tenyard-autoscaler` it reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: [events, endpoints]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [update]
  - apiGroups: [""]
    resources: [endpoints]
    resourceNames: [cluster-autoscaler]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [watch, list, get, update]
  - apiGroups: [""]
    resources: [podtemplates, configmaps]
    verbs: [watch, list, get]
  - apiGroups: [""]
    resources: [namespaces, pods, services, replicationcontrollers, persistentvolumeclaims, persistentvolumes]
    verbs: [watch, list, get]
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices, deviceclasses, resourceclaims]
    verbs: [watch, list, get]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [watch, list, get, patch]
  - apiGroups: [apps]
    resources: [daemonsets, replicasets, statefulsets]
    verbs: [watch, list, get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [watch, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers, csistoragecapacities, volumeattachments]
    verbs: [watch, list, get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [cluster-autoscaler]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-autoscaler }
subjects: [{ kind: ServiceAccount, name: cluster-autoscaler, namespace: kube-system }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-autoscaler-status, cluster-autoscaler-priority-expander]
    verbs: [delete, get, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-autoscaler }
subjects: [{ kind: ServiceAccount, name: cluster-autoscaler, namespace: kube-system }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-priority-expander
  namespace: kube-system
data:
  priorities: |-
    30: [^box-cx43$]
    20: [^box-cpx32$]
    10: [^box-cpx42$]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: cluster-autoscaler }
  template:
    metadata:
      labels: { app: cluster-autoscaler }
    spec:
      serviceAccountName: cluster-autoscaler
      priorityClassName: system-cluster-critical
      # On the control plane, so the pool can go down to zero.
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: Exists }
      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.36.1
          command:
            - ./cluster-autoscaler
            - --cloud-provider=hetzner
            - --nodes=0:3:cx43:hel1:box-cx43
            - --nodes=0:6:cpx32:hel1:box-cpx32
            - --nodes=0:3:cpx42:hel1:box-cpx42
            - --expander=priority
            - --cores-total=0:32
            - --scale-down-unneeded-time=50m
            # coredns, metrics-server and the CSI controller have no PDB; without this a worker
            # they moved to never goes. They tolerate the control plane and move back there.
            - --skip-nodes-with-system-pods=false
            # A new worker carries this taint until the CCM sets its providerID; without the flag
            # the autoscaler takes it for a full node and adds one more.
            - --startup-taint=node.cloudprovider.kubernetes.io/uninitialized
            - --stderrthreshold=info
          env:
            - name: HCLOUD_TOKEN
              valueFrom: { secretKeyRef: { name: hcloud, key: token } }
            - { name: HCLOUD_CLUSTER_CONFIG_FILE, value: /config/cluster-config.json }
            - { name: HCLOUD_NETWORK, value: tenyard-net }
            - { name: HCLOUD_FIREWALL, value: tenyard-worker }
            - { name: HCLOUD_SSH_KEY, value: main }
          resources:
            requests: { cpu: 100m, memory: 300Mi }
            limits: { cpu: 100m, memory: 300Mi }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: ssl-certs, mountPath: /etc/ssl/certs/ca-certificates.crt, readOnly: true }
      volumes:
        - name: config
          secret: { secretName: tenyard-autoscaler, items: [{ key: cluster-config.json, path: cluster-config.json }] }
        - name: ssl-certs
          hostPath: { path: /etc/ssl/certs/ca-certificates.crt }
