[SERVICE]
    flush        1
    log_level    warn

[INPUT]
    name         tcp
    listen       127.0.0.1
    port         5170
    format       json
    tag          egress

[OUTPUT]
    name         http
    match        egress
    host         victoria-logs.monitoring.svc.cluster.local
    port         9428
    uri          /insert/jsonline?_stream_fields=stream&_msg_field=url&_time_field=time&extra_fields=stream=egress
    format       json_lines
    json_date_key false
    retry_limit  false
