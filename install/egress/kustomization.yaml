apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [proxy.yaml]
configMapGenerator:
  - name: proxy
    namespace: egress
    files: [squid.conf, fluent-bit.conf]
  - name: injector-ca
    namespace: egress
    files: [ca.crt=injector-ca.crt]
  - name: injector-ca
    namespace: tenbox
    files: [ca.crt=injector-ca.crt]
    options: { disableNameSuffixHash: true }
