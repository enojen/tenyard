# The process groups of a box (README, "Process metrics"): the process-exporter sidecar of
# job.yaml puts each process of the pod into the first group that matches it, by its argv joined
# with spaces. A process that matches none counts in the group of its nearest matched parent.
# Only the group names leave the pod, never a command line.
apiVersion: v1
kind: ConfigMap
metadata: { name: process-groups, namespace: tenbox }
data:
  groups.yaml: |
    process_names:
      # The sidecars of services/.
      - name: service
        comm: [postgres, redis-server, mysqld]
      # boot.sh's own poll of the sessions, before claude takes it.
      - name: other
        cmdline: ['^(\S*/)?claude agents\b']
      - name: claude
        exe: [claude]
      - name: claude
        cmdline: ['^\S*/claude/versions/']
      # The tenbox CLI: the checks it starts match their own groups.
      - name: tenbox
        cmdline: ['^(\S*/)?bun \S*tenbox\S*( |$)']
      - name: tenbox
        exe: [tenbox]
      - name: test
        cmdline: ['\b(bun test|vitest|jest|mocha|playwright test|(npm|pnpm|yarn|bun) (run )?test)\b']
      - name: tsc
        cmdline: ['\b(tsc|tsgo|vue-tsc)\b']
      - name: lint
        cmdline: ['\b(biome|eslint|oxlint|prettier|knip)\b']
      - name: install
        cmdline: ['\b(bun|npm|pnpm|yarn) (install|ci|i|add)\b']
      - name: git
        comm: [git, git-remote-http, ssh]
      # The roots of the pod: what boot.sh and the pod start, and what matches nothing below them.
      - name: other
        comm: [pause, process-exporte, sudo, tee]
      - name: other
        cmdline: ['^(\S*/)?bash \S*/tenbox-boot\b']
