# Postgres for a project's tests, next to the box: a native sidecar (an init container that
# keeps running), so the box starts once Postgres takes connections and the Job still ends when
# the box ends. The data lives in memory and nothing is flushed: a test database is thrown away
# with the pod. The box reaches it on TEST_PG_URL. A Job takes it as a strategic merge patch
# (tenbox: `machine.services` of the project's tenbox.yaml; run.sh: SERVICES).
spec:
  template:
    spec:
      initContainers:
        - name: postgres
          image: pgvector/pgvector:pg16
          restartPolicy: Always
          args:
            - -c
            - fsync=off
            - -c
            - synchronous_commit=off
            - -c
            - full_page_writes=off
            - -c
            - max_connections=300
          env:
            - { name: POSTGRES_USER, value: test }
            - { name: POSTGRES_PASSWORD, value: test }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, test] }
            periodSeconds: 1
            failureThreshold: 120
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
      containers:
        - name: box
          env:
            - { name: TEST_PG_URL, value: "postgres://test:test@127.0.0.1:5432" }
      volumes:
        - name: pgdata
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
