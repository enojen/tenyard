project: tenyard
setup: bun install && tools/install.sh

# sim/ is the only code: the replay of recorded runs through worker policies (#32). The
# manifests and the shell scripts get their own checks; CI runs them on every PR.
checks:
  fast:
    # sim/ is empty until the first part of #32: each check passes on no file.
    types: '[ -z "$(find sim -name "*.ts")" ] || bunx tsgo --noEmit'
    unit: bun test sim --pass-with-no-tests
    format: bunx biome format --no-errors-on-unmatched sim
    lint: bunx biome check --formatter-enabled=false --no-errors-on-unmatched sim
    manifests: tools/check-manifests.sh
    scripts: tools/check-scripts.sh
    secrets: tools/check-secrets.sh

